<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="version" content="1.0.0">
  <title>CRA Tax Reporting</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <h1>CRA Tax Reporting</h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="tax.html" class="active">Tax</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <div class="filters">
        <label>
          Tax year
          <select id="f-cra-year"></select>
        </label>

        <label>
          Account source
          <select id="f-cra-source">
            <option value="All">All</option>
            <option value="IBKR">IBKR</option>
            <option value="HSBC">HSBC</option>
          </select>
        </label>
        <label>
  Individual account
  <select id="f-cra-account">
    <option value="All">All accounts</option>
  </select>
</label>

        <button id="btn-cra-refresh">Refresh</button>
        <button id="btn-cra-export">Export CRA CSV</button>
      </div>

      <div id="cra-status" class="status"></div>

      <div class="summary-grid">
        <div class="summary">
          <span>Total proceeds</span>
          <strong id="sum-proceeds">—</strong>
        </div>
        <div class="summary">
          <span>Total ACB</span>
          <strong id="sum-acb">—</strong>
        </div>
        <div class="summary">
          <span>Net capital gain / loss</span>
          <strong id="sum-gain">—</strong>
        </div>
        <div class="summary">
          <span>Taxable capital gain</span>
          <strong id="sum-taxable">—</strong>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Annual Realized Capital Gains</h2>
      <div class="table-wrap">
        <table id="cra-gains-table">
          <thead>
  <tr>
    <th>Date</th>
    <th>Source</th>
    <th>Symbol</th>
    <th>Description</th>
    <th class="num">QTY SOLD</th>
    <th class="num">Proceeds</th>
    <th class="num">ACB</th>
    <th class="num">Gain/Loss</th>
    <th class="num">ACB CAD</th>
    <th class="num">Gain/Loss CAD</th>
    <th>CCY</th>
    <th class="num">FX Rate</th>
  </tr>
</thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
  const taxScript = document.createElement('script');
  taxScript.src = 'tax.js?v=' + Date.now();
  document.body.appendChild(taxScript);
</script>
</body>
</html>
