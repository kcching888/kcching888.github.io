<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRA Tax Reporting</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #e94560;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        select, button {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #4f98a3;
            background: #16213e;
            color: #e0e0e0;
        }

        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #333;
            text-align: left;
        }

        .text-right {
            text-align: right;
        }

        .pos-gain { color: #4caf50; }
        .pos-loss { color: #f44336; }
    </style>
</head>
<body>

    <h1>CRA Tax Reporting</h1>

    <div class="filter-bar">
        <select id="f-cra-year"></select>

        <select id="f-cra-source">
            <option value="ALL">All Accounts</option>
            <option value="IBKR">IBKR</option>
            <option value="HSBC">HSBC</option>
        </select>

        <button onclick="renderCraCapitalGains()">
            Refresh
        </button>

        <button onclick="exportCraCapitalGains()">
            Export CSV
        </button>
    </div>

    <div id="cra-summary"></div>
    <div id="cra-table"></div>

    <script src="tax.js"></script>
</body>
</html>
